<script type="text/javascript">
// 参考 https://developer.mozilla.org/zh-CN/docs/Web/API/HTMLTextAreaElement
// selectionStart: 开始光标右侧的第一个字符
// selectionEnd:   结束光标右侧的第一个字符

/**
 * 移动光标
 * @param {HTMLTextAreaElement} textarea - 目标元素
 * @param {string} direction - 方向：left/right/up/down
 */
function textarea_moveCursor(textarea, direction) {
  const cursorPos = textarea.selectionStart;
  const value = textarea.value;
  
  switch(direction) {
    case 'left':
      // 左移：位置-1，最小为0
      textarea_setCursorPosition(textarea, Math.max(0, cursorPos - 1));
      break;
    case 'right':
      // 右移：位置+1，最大为文本长度
      textarea_setCursorPosition(textarea, Math.min(cursorPos + 1, value.length));
      break;
    case 'up':
      // 上移：找到上一行的对应位置（需解析换行符）
      const beforeCursor = value.substring(0, cursorPos);
      const lastNewlineIndex = beforeCursor.lastIndexOf('\n');
      if (lastNewlineIndex !== -1) {
        // 上一行的列数 = 当前光标到换行符的距离
        const col = beforeCursor.length - lastNewlineIndex - 1;
        // 上一行的起始位置 = 上上行的换行符位置（无则为0）
        const prevNewlineIndex = value.substring(0, lastNewlineIndex).lastIndexOf('\n');
        const targetPos = prevNewlineIndex + 1 + col;
        textarea_setCursorPosition(textarea, Math.max(0, targetPos));
      } else {
        // 第一行，上移到开头
        textarea_setCursorPosition(textarea, 0);
      }
      break;
    case 'down':
      // 下移：找到下一行的对应位置
      const afterCursor = value.substring(cursorPos);
      const nextNewlineIndex = afterCursor.indexOf('\n');
      if (nextNewlineIndex !== -1) {
        const col = cursorPos - value.substring(0, cursorPos).lastIndexOf('\n') - 1;
        const nextLineStart = cursorPos + nextNewlineIndex + 1;
        // 下一行的目标位置 = 下一行起始 + 列数（不超过下一行长度）
        const nextLineEnd = value.indexOf('\n', nextLineStart) || value.length;
        const targetPos = Math.min(nextLineStart + col, nextLineEnd);
        textarea_setCursorPosition(textarea, targetPos);
      } else {
        // 最后一行，下移到末尾
        textarea_setCursorPosition(textarea, value.length);
      }
      break;
  }
}

/**
 * 定位光标到指定位置
 * @param {HTMLTextAreaElement} textarea - 目标textarea元素
 * @param {number} position - 光标位置（0开始，比如3表示第4个字符后）
 */
function textarea_setCursorPosition(textarea, position) {
  // 边界处理：避免位置超出文本长度
  position = Math.max(0, Math.min(position, textarea.value.length));
  
  // 核心：设置selectionStart和selectionEnd为同一位置（纯光标）
  textarea.selectionStart = position;
  textarea.selectionEnd = position;
  
  // 移动端关键：确保textarea获得焦点（否则光标不显示）
  textarea.focus();
  
  // iOS 兜底：部分浏览器需要强制刷新焦点
  setTimeout(() => textarea.focus(), 0);
}


function textarea_focus_with_select(textarea, startPos, endPos) {
    // 重新设置位置会导致偏移，要记录偏移位置用于恢复
    // 记录位置
    var scrollTop = textarea.scrollTop;

    // 执行
    textarea.focus();  
    textarea.selectionStart = startPos;
    textarea.selectionEnd   = endPos;

    // 恢复位置
    textarea.scrollTop = scrollTop;
}

function textarea_insert(textarea, value) {
    if (document.selection) {  
        //IE 浏览器  
        textarea.focus();  
        sel = document.selection.createRange();
        sel.text = value;  
        sel.select();
    }  else if (textarea.selectionStart || textarea.selectionStart == '0') { 
        // FireFox、Chrome等
        var startPos = textarea.selectionStart;  
        var endPos   = textarea.selectionEnd; 

        var textLeft = textarea.value.substring(0, startPos);
        var textRight = textarea.value.substring(endPos, textarea.value.length);

        textarea.value = textLeft + value + textRight;

        // 设置完之后会自动失去焦点，需要重新取得焦点
        textarea_focus_with_select(textarea, startPos + value.length, startPos + value.length);
    } else {  
        // 没有选中
        textarea.value += value;
        textarea.focus();
    }  
}  

/**
 * 返回当前行的位置
 * @param {textarea} textarea 文本框对象
 * @return {array} 返回位置信息 [startPos, endPos]
 */
function textarea_current_line_pos(textarea) {
    var startPos = textarea.selectionStart;  
    var endPos   = textarea.selectionEnd; 
    var length   = textarea.value.length;
    var textValue = textarea.value;

    var indexLeft = 0;
    var indexRight = length - 1;

    // 从光标左边的一个字符开始
    for (var i = startPos - 1; i >= 0; i--) {
        if (textValue[i] == '\n') {
            indexLeft = i + 1;
            break;
        }
    }

    for (var i = endPos; i < length; i++) {
        if (textValue[i] == '\n') {
            indexRight = i;
            break;
        }
    }
    // indexLeft: 当前行的开始位置
    // indexRight: 当前行结束的位置，包括换行
    return [indexLeft, indexRight];
}

/**
 * 返回当前行
 * @param {textarea} textarea对象
 * @return {string} 当前行的文本
 */
function textarea_current_line(textarea) {
    var textValue = textarea.value;
    var pos = textarea_current_line_pos(textarea);

    return textValue.substring(pos[0], pos[1]);
}

function textarea_replace_line(textarea, source, target) {
    var textValue = textarea.value;
    var pos = textarea_current_line_pos(textarea);
    var line = textValue.substring(pos[0], pos[1]);
    var lineNew = line.replace(source, target);

    var valueLeft = textValue.substring(0, pos[0]);
    var valueRight = textValue.substring(pos[1], textarea.value.length);

    textarea.value = valueLeft + lineNew + valueRight;

    // 重新获取焦点
    textarea_focus_with_select(textarea, pos[0], pos[0] + lineNew.length);
}

</script>
