{% init filter_html = "" %}
{% init filter_config_key = "task.filter" %}
<div class="card">
    <div class="split-title">
        <span class="bold">过滤器</span>
        <div class="float-right">
            <span>[</span>
            <a data-key="{{filter_config_key}}" onclick="xnoteEditFilter(this);">编辑</a>
            <span>]</span>
        </div>
    </div>
    <div class="padding-sm">
        {% raw filter_html %}
    </div>
</div>

<script>
xnote.state.codeEditDialogId = 0;
function xnoteEditFilter(target) {
    console.log(target);
    var key = $(target).attr("data-key");
    var url = "/code/edit/user_config?is_iframe=true&config_key=" + encodeURIComponent(key);
    xnote.state.codeEditDialogId = xnote.showIframeDialog("编辑", url);
}

// 处理编辑后的回调事件
xnote.on("code_edit", function (event) {
    console.log("event=", event);
    xnote.closeDialog(xnote.state.codeEditDialogId);
    window.location.reload();
});

// 处理关闭事件
xnote.on("code_edit.close", function (event) {
    xnote.closeDialog(xnote.state.codeEditDialogId);
});
</script>
