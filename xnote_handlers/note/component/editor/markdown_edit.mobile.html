{% extends base.html %} 

{% block head %}
<script type="text/javascript" src="{{_server_home}}/_static/lib/webuploader/webuploader.nolog.min.js"></script>

<style>
    textarea {
        outline: none;
        border-radius: 0px;
        font-size: 14px;
    }

    textarea:focus {
        border: 1px solid #8cc;
    }

    .keyboard-row {
        width: 100%;
        float: left;
        overflow-x: auto;
    }

    .keyboard-scroll {
        float: left;
        width: 500px;
    }

    .debug-info {
        display: none;
        word-break: break-all;
        word-wrap: break-word;
        padding: 5px;
        margin-bottom: 10px;
        background-color: #e6ffed;
        border: 1px solid #a3d9b1;
        border-radius: 5px;
    }
</style>
{% end %} 

{% block body %} 

{% init back_btn_text = T("返回") %}
{% init error = "" %} 

<div class="alert">
    {{error}}
</div>

<div class="debug-info">
</div>

<div class="card">
    <form id="mainFrame" action="{{_server_home}}/note/update" enctype="multipart/form-data" method="POST" class="col-md-12">
        <div class="col-md-12" id="submit-div">
            <div>
                <span id="fileId" class="hide">{{file.id}}</span>
            </div>
            <div class="grid-title btn-line-height">
                <span>文档编辑</span>
                <div class="float-right">
                    <input type="button" id="actionBtn" class="btn btn-default hide" value="快捷操作"/>
                    <input type="submit" class="btn save-note-btn" value="保存">
                    <input type="button" id="backBtn"   class="btn btn-default back-btn" value="{{back_btn_text}}"/>
                </div>
            </div>
        </div>

        <div class="col-md-12">
            <span id="result" style="color:green"></span>
            <div class="col-md-12" id="editor-area">
                <div class="col-md-12">
                    <div id="edit-div">
                        <input style="display:none" name="id" value="{{file.id}}" />
                        <input type="text" name="version" value="{{file.version}}" class="hide" />
                        <input type="text" name="type" value="md" class="hide" />
                    </div>
                </div>

                <div class="col-md-12">
                    <div id="editor" class="col-md-12" style="height: auto; ">
                        <div id="markdown-input-div" class="col-md-12">
                            <textarea id="markdown-input" class="form-control" name="content" rows="15">{{file.content}}</textarea>
                        </div>

                        <div id="markdown-output-div" class="col-md-6 hide"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <input type="file" id="uploadFileInput" class="hide"/>
        </div>
        
        <div class="keyboard-row">
            <div class="keyboard-scroll">
                <input type="button" class="btn-default" onclick="xnote.onAddAttachmentClick()" value="附件"/>
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="#">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="##">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="*">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="-">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="[">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="]">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="!">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="`">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="代码块" data-value="```&#10;[代码]&#10;```">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="Tab" data-value="&nbsp;&nbsp;&nbsp;&nbsp;">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="《">
                <input type="button" class="btn-default" onclick="xnote.editor.insertByElement(this)" value="》">
                <input type="button" class="btn-default" onclick="xnote.editor.moveCursor(this, 'left')" value="←">
                <input type="button" class="btn-default" onclick="xnote.editor.moveCursor(this,'right')" value="→">
            </div>
        </div>
    </form>
</div>

{% include common/script/textarea_script.html %}


<script>

// 监听全局双击事件，阻止默认行为
document.addEventListener('dblclick', (e) => {
  e.preventDefault(); // 阻止双击放大
  e.stopPropagation();
}, { passive: false }); // 必须设为 false，否则无法阻止默认行为

var enableDebug = xnote.getUrlParam("debug") === "true";

function updateViewHeight() {
    if (this.count === undefined) {
        this.count = 0;
    }
    this.count++;
    try {
        var actionRowHeight = 50;
        var markdownInputTop = $("#markdown-input").offset().top;
        var topBarHeight = window.screen.height - window.innerHeight;
        var markdownInputHeight = window.innerHeight - markdownInputTop - actionRowHeight;
        
        if (enableDebug) {
            var deviceInfo = "window.innerWidth=" + window.innerWidth + ",window.innerHeight=" + window.innerHeight;
        }

        if (window.visualViewport) {
            var viewHeight = window.visualViewport.height;

            if (enableDebug) {
                // 初始高度
                deviceInfo +=",visualViewport.height=" + viewHeight;
            }
    
            markdownInputHeight = viewHeight - markdownInputTop - actionRowHeight;
        }
    
        if (enableDebug) {
            deviceInfo += ",markdownInputTop=" + markdownInputTop;
            deviceInfo += ",markdownInputHeight=" + markdownInputHeight;
            deviceInfo += ",count=" + this.count;
            $(".debug-info").text(deviceInfo);
        }
        
        $("#markdown-input").height(markdownInputHeight);

        // 立即滚动到top
        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "instant"
        });
    } catch (error) {
        $(".debug-info").text(error);
    }

    setTimeout(updateViewHeight, 200);
}

$(function () {
    updateViewHeight();
    setTimeout(updateViewHeight, 200);
    $(window).on("resize", updateViewHeight);
})
</script>


<script type="text/javascript">

// 支持上传文件
$(function () {
    function getContent() {
        return $("#markdown-input").val();
    }

    function getEditor() {
        return $("#markdown-input")[0];
    }

    xnote.editor.insertByElement = function (ele) {
        var dataValue = $(ele).attr("data-value");
        if (dataValue) {
            textarea_insert(getEditor(), dataValue);
            return;
        }
        var value = $(ele).val();
        textarea_insert(getEditor(), value);
    }

    xnote.editor.moveCursor = function (ele, direction) {
        textarea_moveCursor(getEditor(), direction);
    }

    // 记录初始内容
    var INITIAL_CONTENT = getContent();
    var IS_FORM_SUBMITTED = false;
    var DIALOG_INDEX = 0;

    xnote.onAddAttachmentClick = function () {
        xnote.requestUploadAuto("#uploadFileInput", false, function (resp) {
            console.log(resp);
            var fileLink = resp.link;
            var editor = getEditor();
            textarea_insert(editor, fileLink);
        });
    };

    function isContentChanged() {
        return getContent() !== INITIAL_CONTENT;
    }

    $("#mainFrame").on("submit", function (e) {
        console.log(e);
        IS_FORM_SUBMITTED = true;
    });

    function checkExit() {
        if (!isContentChanged()) {
            return;
        }

        if (IS_FORM_SUBMITTED) {
            return;
        }

        return "修改尚未提交, 确定离开当前页面吗？";
    }

    $("#backBtn").click(function() {
        var message = checkExit();
        if (message) {
            xnote.confirm(message, function() {
                history.back();
            });
        } else {
            history.back();
        }
    });

    $("#actionBtn").click(function () {
        xnote.http.get("/note/ajax/edit_symbol_dialog", function (resp) {
            DIALOG_INDEX = xnote.showDialog("请选择符号", resp);
        });
    });

    $("body").on("click", ".symbol-item-btn", function (e) {
        var target = e.target;
        var editor = getEditor();
        var text = $(target).attr("data-text");
        
        if (text === "" || text === undefined) {
            text = $(target).text();
        }

        console.log(text);
        textarea_insert(editor, text);
        layer.close(DIALOG_INDEX);
    });

    $("body").on("click", ".symbol-action-btn", function (e) {
        var target = e.target;
        var action = $(target).attr("data-action");

        var editor = getEditor();
        
        if (action == "finish_task") {
            textarea_replace_line(editor, "[]", "[x]");
        }
        
        if (action == "redo_task") {
            textarea_replace_line(editor, "[x]", "[]");
        }

        if (action == "note_link") {
            xnote.showAjaxDialog("选择笔记", "/search/dialog?search_type=note&callback=insertNoteLinkCallback");

            window.insertNoteLinkCallback = function (param) {
                var link = "[" + param.name + "](" + param.url + ")";
                textarea_insert(editor, link);
                xnote.closeDialog("last");
            };
        }

        layer.close(DIALOG_INDEX);
    });

    // 保存笔记
    $(".save-note-btn").click(function(e) {
        e.preventDefault();

        var params = {
            id: "{{file.id}}",
            version: "{{file.version}}",
            type: "md",
            content: getContent()
        };
        xnote.http.post("/note/save", params, function (resp) {
            if (resp.success) {
                IS_FORM_SUBMITTED = true;
                xnote.toast("保存成功");
                setTimeout(function () {
                    window.location.href = "{{file.url}}";
                }, 500);
            } else {
                xnote.alert("保存失败:" + resp.message);
            }
        });
    });
})
</script>

<!-- GROUPS: {{file.groups}} -->
{% end %}
